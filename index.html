<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>字幕エディタ</title>
  <style>
    body { font-family: sans-serif; padding: 1rem; }
    input[type="text"] { padding: 5px; width: 80%; }
    .subtitle-row { display: flex; align-items: center; margin-bottom: 5px; }
    .time-input { width: 80px; margin-right: 10px; }
    .subtitle-input { flex: 1; }
    #subtitleList { margin-top: 1rem; }
    #sheetSelector button { display: block; margin-bottom: 5px; width: 100%; }
    iframe { width: 100%; height: 360px; margin: 1rem 0; }
    #syncButton { display: block; margin: 1rem auto; padding: 0.5rem 1rem; }
  </style>
</head>
<body>

<h2>字幕データ一覧</h2>
<div id="sheetSelector"></div>

<h2>YouTube動画のURLを入力</h2>
<input type="text" id="videoUrl" placeholder="YouTubeのURLを入力">
<button onclick="loadVideo()">読み込む</button>

<div id="playerContainer"></div>
<button id="syncButton" onclick="syncPlay()">字幕と動画を同期再生</button>

<h3 id="currentSheetName"></h3>
<div id="subtitleList"></div>

<script>
  const apiBase = "https://script.google.com/macros/s/AKfycbzqGLb-WTleiLCt1ee3tDux4Lr4AczdrILq-w1AIAyXgRriASpQylx7cN-_L6Dke2Z72Q/exec"; // ←自分の最新デプロイGAS URL

  const formatTime = (raw) => {
    const date = new Date(raw);
    const minutes = String(date.getMinutes()).padStart(2, '0');
    const seconds = String(date.getSeconds()).padStart(2, '0');
    const ms = String(Math.floor(date.getMilliseconds() / 100));
    return `${minutes}:${seconds}.${ms}`;
  };

  function extractVideoId(url) {
    const match = url.match(/(?:v=|\/)([0-9A-Za-z_-]{11})/);
    return match ? match[1] : null;
  }

  function loadVideo() {
    const url = document.getElementById('videoUrl').value;
    const videoId = extractVideoId(url);
    if (!videoId) return alert("動画IDが取得できませんでした");
    displayVideo(videoId);
    fetchSubtitles(videoId);
  }

  function displayVideo(videoId) {
    const playerContainer = document.getElementById("playerContainer");
    playerContainer.innerHTML = `<iframe id="ytPlayer" src="https://www.youtube.com/embed/${videoId}?enablejsapi=1" frameborder="0" allowfullscreen></iframe>`;
  }

  function fetchSubtitles(videoId) {
    fetch(`${apiBase}?videoId=${videoId}`)
      .then(res => res.json())
      .then(data => {
        document.getElementById("currentSheetName").textContent = `字幕シート名: ${data.sheetName}`;
        displaySubtitles(data.subtitles);
      });
  }

  function displaySubtitles(subtitles) {
    const container = document.getElementById("subtitleList");
    container.innerHTML = "";
    subtitles.forEach(sub => {
      const row = document.createElement("div");
      row.className = "subtitle-row";
      row.innerHTML = `
        <input class="time-input" value="${formatTime(sub.time)}">
        <input class="subtitle-input" value="${sub.text}">
      `;
      container.appendChild(row);
    });
  }

  function loadSheetList() {
    fetch(`${apiBase}?listSheets=true`)
      .then(res => res.json())
      .then(data => {
        const selector = document.getElementById("sheetSelector");
        selector.innerHTML = "";
        data.sheetNames.forEach(name => {
          const btn = document.createElement("button");
          btn.textContent = name;
          btn.onclick = () => {
            fetch(`${apiBase}?sheetName=${encodeURIComponent(name)}`)
              .then(res => res.json())
              .then(data => {
                displayVideo(data.videoId);
                document.getElementById("currentSheetName").textContent = `字幕シート名: ${name}`;
                displaySubtitles(data.subtitles);
              });
          };
          selector.appendChild(btn);
        });
      });
  }

  function syncPlay() {
    const iframe = document.querySelector("#ytPlayer");
    iframe.contentWindow.postMessage('{"event":"command","func":"playVideo","args":""}', '*');
  }

  // 初期化（初期動画IDを設定）
  window.onload = () => {
    const defaultVideoId = "EJlmCPF55ZQ";
    document.getElementById("videoUrl").value = `https://youtu.be/${defaultVideoId}`;
    displayVideo(defaultVideoId);
    fetchSubtitles(defaultVideoId);
    loadSheetList();
  };
</script>
</body>
</html>
