<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>字幕編集ツール</title>
  <style>
    body { font-family: sans-serif; padding: 1rem; }
    #video-container { position: relative; width: 100%; max-width: 640px; margin-bottom: 1rem; }
    #subtitle-overlay {
      position: absolute;
      bottom: 10%;
      width: 100%;
      text-align: center;
      color: white;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.7);
      pointer-events: none;
    }
    .hidden { display: none; }
    .sheet-list { margin-bottom: 1rem; }
    .subtitle-row { display: flex; margin-bottom: 0.5rem; gap: 0.5rem; }
    .subtitle-row input[type="text"]:first-child {
      width: 5rem;
    }
    .subtitle-row input[type="text"]:last-child {
      flex: 1;
    }
    .controls { margin-bottom: 1rem; }
    .font-size-controls { margin: 1rem 0; }
    #subtitles-container { max-width: 100%; }
  </style>
</head>
<body>
  <h2>字幕編集ツール</h2>

  <button onclick="toggleSheetList()">字幕データ一覧を表示/非表示</button>
  <div id="sheet-list" class="sheet-list hidden"></div>

  <div>
    <label for="url-input">動画URL：</label>
    <input id="url-input" type="text" style="width: 60%;">
    <button onclick="loadVideoFromURL()">読み込み</button>
  </div>

  <div id="current-sheet" style="margin: 1rem 0; font-weight: bold;"></div>

  <div id="video-container">
    <iframe id="yt-player" width="640" height="360" frameborder="0" allowfullscreen></iframe>
    <div id="subtitle-overlay" class="subtitle-medium"></div>
  </div>

  <div class="controls">
    <button onclick="syncPlay()">字幕と動画を同期再生</button>
    <button onclick="pauseVideo()">一時停止</button>
    <button onclick="seekVideo(-10)">10秒戻す</button>
    <button onclick="seekVideo(10)">10秒進める</button>
  </div>

  <div class="font-size-controls">
    <label>字幕サイズ：
      <select id="font-size-selector" onchange="changeFontSize(this.value)">
        <option value="small">小</option>
        <option value="medium" selected>中</option>
        <option value="large">大</option>
      </select>
    </label>
  </div>

  <div id="subtitles-container"></div>
  <button onclick="addSubtitleRow()">＋ 行を追加</button>

  <script>
    let player;
    let subtitles = [];
    let currentSheetName = "";

    function toggleSheetList() {
      const list = document.getElementById('sheet-list');
      list.classList.toggle('hidden');
    }

    function changeFontSize(size) {
      const overlay = document.getElementById('subtitle-overlay');
      overlay.className = '';
      overlay.classList.add('subtitle-' + size);
    }

    function formatTimeExcel(value) {
      const date = new Date(value);
      const minutes = date.getUTCMinutes();
      const seconds = date.getUTCSeconds();
      const millis = Math.floor(date.getUTCMilliseconds() / 100);
      return `${minutes}:${seconds.toString().padStart(2, '0')}.${millis}`;
    }

    function parseVideoId(url) {
      const match = url.match(/(?:youtube\.com.*[?&]v=|youtu\.be\/)([\w-]+)/);
      return match ? match[1] : url;
    }

    function loadVideoFromURL() {
      const url = document.getElementById('url-input').value;
      const videoId = parseVideoId(url);
      loadVideo(videoId);
    }

    function loadVideo(videoId) {
      document.getElementById('yt-player').src = `https://www.youtube.com/embed/${videoId}?enablejsapi=1`;
      fetch(`https://script.google.com/macros/s/AKfycbzqGLb-WTleiLCt1ee3tDux4Lr4AczdrILq-w1AIAyXgRriASpQylx7cN-_L6Dke2Z72Q/exec?videoId=${videoId}`)
        .then(res => res.json())
        .then(data => {
          currentSheetName = data.sheetName;
          subtitles = data.subtitles;
          document.getElementById('current-sheet').innerText = `現在のシート: ${currentSheetName}`;
          renderSubtitles();
        })
        .catch(() => {
          subtitles = [];
          currentSheetName = "";
          document.getElementById('current-sheet').innerText = "字幕データが取得できませんでした。";
          renderSubtitles();
        });
    }

    function renderSubtitles() {
      const container = document.getElementById('subtitles-container');
      container.innerHTML = '';
      for (let i = 0; i < Math.max(subtitles.length, 30); i++) {
        const row = document.createElement('div');
        row.className = 'subtitle-row';
        const timeInput = document.createElement('input');
        timeInput.type = 'text';
        timeInput.value = subtitles[i] ? formatTimeExcel(subtitles[i].time) : '';
        const textInput = document.createElement('input');
        textInput.type = 'text';
        textInput.value = subtitles[i] ? subtitles[i].text : '';
        row.appendChild(timeInput);
        row.appendChild(textInput);
        container.appendChild(row);
      }
    }

    function addSubtitleRow() {
      subtitles.push({ time: '', text: '' });
      renderSubtitles();
    }

    function seekVideo(seconds) {
      const iframe = document.getElementById('yt-player');
      iframe.contentWindow.postMessage(JSON.stringify({ event: 'command', func: 'seekTo', args: [seconds, true] }), '*');
    }

    function pauseVideo() {
      const iframe = document.getElementById('yt-player');
      iframe.contentWindow.postMessage(JSON.stringify({ event: 'command', func: 'pauseVideo' }), '*');
    }

    function syncPlay() {
      const iframe = document.getElementById('yt-player');
      iframe.contentWindow.postMessage(JSON.stringify({ event: 'command', func: 'playVideo' }), '*');
      let idx = 0;
      const overlay = document.getElementById('subtitle-overlay');
      const interval = setInterval(() => {
        const time = subtitles[idx]?.time;
        if (!time) return;
        const date = new Date(time);
        const now = new Date();
        overlay.innerText = subtitles[idx].text;
        idx++;
        if (idx >= subtitles.length) clearInterval(interval);
      }, 2000);
    }

    // 初期表示処理
    fetch("https://script.google.com/macros/s/AKfycbzqGLb-WTleiLCt1ee3tDux4Lr4AczdrILq-w1AIAyXgRriASpQylx7cN-_L6Dke2Z72Q/exec?listSheets=true")
      .then(res => res.json())
      .then(data => {
        const container = document.getElementById("sheet-list");
        data.sheetNames.forEach(name => {
          const btn = document.createElement("button");
          btn.textContent = name;
          btn.onclick = () => {
            fetch(`https://script.google.com/macros/s/AKfycbzqGLb-WTleiLCt1ee3tDux4Lr4AczdrILq-w1AIAyXgRriASpQylx7cN-_L6Dke2Z72Q/exec?sheetName=${name}`)
              .then(res => res.json())
              .then(data => {
                document.getElementById("url-input").value = `https://youtu.be/${data.videoId}`;
                loadVideo(data.videoId);
              });
          };
          container.appendChild(btn);
        });
      });

    // 初期動画読み込み
    window.onload = () => {
      loadVideo("EJlmCPF55ZQ");
    };
  </script>
</body>
</html>
