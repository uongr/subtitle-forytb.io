<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>字幕編集ツール</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
    }
    iframe {
      width: 100%;
      height: 360px;
      margin-bottom: 20px;
    }
    .subtitle-row {
      display: flex;
      align-items: center;
      margin-bottom: 5px;
    }
    .subtitle-row input[type="text"] {
      padding: 5px;
      margin-right: 10px;
    }
    .subtitle-row input[type="text"].time {
      width: 60px; /* 約1/4幅 */
    }
    #sheetListArea button {
      margin: 5px 10px 5px 0;
    }
    #currentSheetName {
      font-weight: bold;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>

  <h2>字幕編集ツール</h2>

  <!-- YouTube URL 入力欄 -->
  <label for="videoUrl">YouTube URL:</label>
  <input type="text" id="videoUrl" placeholder="https://www.youtube.com/watch?v=...">
  <button onclick="loadVideoFromUrl()">読み込み</button>

  <!-- YouTube iframe -->
  <iframe id="ytPlayer" src="" frameborder="0" allowfullscreen></iframe>

  <!-- 表示中の字幕シート名 -->
  <div id="currentSheetName"></div>

  <!-- シート名一覧 -->
  <details>
    <summary>字幕データ一覧（シート名）</summary>
    <div id="sheetListArea"></div>
  </details>

  <!-- 字幕データ表示領域 -->
  <div id="subtitleArea"></div>

  <script>
    const scriptBaseUrl = "https://script.google.com/macros/s/【あなたのデプロイURL】/exec";
    const defaultVideoId = "EJlmCPF55ZQ";

    function extractVideoId(url) {
      const regExp = /(?:v=|\/)([0-9A-Za-z_-]{11})/;
      const match = url.match(regExp);
      return match ? match[1] : defaultVideoId;
    }

    function updateVideo(videoId) {
      const iframe = document.getElementById("ytPlayer");
      iframe.src = `https://www.youtube.com/embed/${videoId}`;
    }

    function displaySubtitles(subtitles) {
      const container = document.getElementById("subtitleArea");
      container.innerHTML = "";
      subtitles.forEach(sub => {
        const row = document.createElement("div");
        row.className = "subtitle-row";

        const timeInput = document.createElement("input");
        timeInput.type = "text";
        timeInput.className = "time";
        timeInput.value = toTimeFormat(sub.time);

        const textInput = document.createElement("input");
        textInput.type = "text";
        textInput.value = sub.text;

        row.appendChild(timeInput);
        row.appendChild(textInput);
        container.appendChild(row);
      });
    }

    function toTimeFormat(time) {
      if (typeof time === "number") {
        const minutes = Math.floor(time / 60);
        const seconds = (time % 60).toFixed(1).padStart(4, "0");
        return `${minutes}:${seconds}`;
      }
      return time; // すでに整形済みならそのまま
    }

    function fetchSubtitles(videoId) {
      fetch(`${scriptBaseUrl}?videoId=${videoId}`)
        .then(res => res.json())
        .then(data => {
          updateVideo(data.videoId);
          document.getElementById("currentSheetName").textContent = `現在の字幕シート: ${data.sheetName}`;
          displaySubtitles(data.subtitles);
        });
    }

    function loadVideoFromUrl() {
      const url = document.getElementById("videoUrl").value;
      const videoId = extractVideoId(url);
      fetchSubtitles(videoId);
    }

    function loadSheetList() {
      fetch(`${scriptBaseUrl}?mode=list`)
        .then(res => res.json())
        .then(sheetNames => {
          const container = document.getElementById("sheetListArea");
          container.innerHTML = "";
          sheetNames.forEach(name => {
            const btn = document.createElement("button");
            btn.textContent = name;
            btn.onclick = () => {
              fetch(`${scriptBaseUrl}?videoId=${name}`)
                .then(res => res.json())
                .then(data => {
                  updateVideo(data.videoId);
                  document.getElementById("currentSheetName").textContent = `現在の字幕シート: ${data.sheetName}`;
                  displaySubtitles(data.subtitles);
                });
            };
            container.appendChild(btn);
          });
        });
    }

    window.onload = () => {
      fetchSubtitles(defaultVideoId);
      loadSheetList();
    };
  </script>

</body>
</html>
