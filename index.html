<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>字幕編集ツール</title>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    .subtitle-row { display: flex; gap: 10px; margin-bottom: 5px; }
    .subtitle-row input[type="text"] { flex: 1; }
    iframe { margin-top: 20px; }
    details { margin: 10px 0; }
  </style>
</head>
<body>
  <h2>字幕編集ツール</h2>

  <label for="videoUrl">YouTube動画URL：</label>
  <input type="text" id="videoUrl" placeholder="https://www.youtube.com/watch?v=..." size="50">
  <button onclick="loadVideo()">動画を読み込む</button>

  <details>
    <summary>字幕データの選択（ドロップダウン）</summary>
    <select id="subtitleList">
      <option value="">字幕を選択してください</option>
      <!-- TODO: 動的にGASから取得して埋め込む -->
    </select>
  </details>

  <div id="player">
    <iframe id="ytPlayer" width="560" height="315" src="" frameborder="0" allowfullscreen></iframe>
  </div>

  <h3>字幕データ</h3>
  <div id="subtitleArea"></div>

  <script>
    const defaultVideoId = "EJlmCPF55ZQ";

    // 共通：YouTube URL から動画IDを抽出
    function extractVideoId(url) {
      const patterns = [
        /youtu\.be\/([a-zA-Z0-9_-]{11})/,
        /v=([a-zA-Z0-9_-]{11})/,
        /embed\/([a-zA-Z0-9_-]{11})/,
        /shorts\/([a-zA-Z0-9_-]{11})/
      ];
      for (const pattern of patterns) {
        const match = url.match(pattern);
        if (match) return match[1];
      }
      return null;
    }

    // 動画を埋め込み & 字幕取得
    function loadVideo() {
      const url = document.getElementById("videoUrl").value;
      const videoId = extractVideoId(url);
      if (!videoId) {
        alert("動画IDを取得できません。URLを確認してください。");
        return;
      }
      updateVideo(videoId);
      fetchSubtitles(videoId);
    }

    function updateVideo(videoId) {
      const embedUrl = `https://www.youtube.com/embed/${videoId}`;
      document.getElementById("ytPlayer").src = embedUrl;
    }

    function fetchSubtitles(videoId) {
      fetch(`https://script.google.com/macros/s/AKfycbyU3zSESmIw9FZbv09gaVlCBFUHWTMt9gcQavNn0XgPbJgulQN0aYuzOAz-YsELVquWJA/exec?videoId=${videoId}`)
        .then(res => res.json())
        .then(data => displaySubtitles(data.subtitles))
        .catch(err => {
          console.error("字幕取得エラー:", err);
          document.getElementById("subtitleArea").innerText = "字幕を取得できませんでした。";
        });
    }

    function displaySubtitles(subtitles) {
      const area = document.getElementById("subtitleArea");
      area.innerHTML = "";
      subtitles.forEach(sub => {
        const row = document.createElement("div");
        row.className = "subtitle-row";

        const timeInput = document.createElement("input");
        timeInput.type = "text";
        timeInput.value = toTimeFormat(sub.time);
        timeInput.size = 7;

        const textInput = document.createElement("input");
        textInput.type = "text";
        textInput.value = sub.text;
        textInput.size = 50;

        row.appendChild(timeInput);
        row.appendChild(textInput);
        area.appendChild(row);
      });
    }

    function toTimeFormat(timeStr) {
      const sec = parseFloat(timeStr);
      const min = Math.floor(sec / 60);
      const secRemainder = (sec % 60).toFixed(1).padStart(4, "0");
      return `${min}:${secRemainder}`;
    }

    // 初期表示処理
    window.onload = () => {
      updateVideo(defaultVideoId);
      fetchSubtitles(defaultVideoId);
    };
  </script>
</body>
</html>
