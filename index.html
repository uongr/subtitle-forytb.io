<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>字幕編集ツール</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 0;
      padding: 1em;
    }
    #subtitle-list-toggle {
      cursor: pointer;
      font-weight: bold;
      margin-bottom: 0.5em;
    }
    #sheetList {
      display: none;
      border: 1px solid #ccc;
      padding: 0.5em;
      max-height: 200px;
      overflow-y: auto;
      margin-bottom: 1em;
    }
    #sheetList div {
      cursor: pointer;
      padding: 0.25em 0;
    }
    #videoContainer {
      display: flex;
      justify-content: center;
      margin-bottom: 1em;
      position: relative;
    }
    #overlaySubtitle {
      position: absolute;
      bottom: 10%;
      left: 50%;
      transform: translateX(-50%);
      background-color: rgba(0, 0, 0, 0.7);
      color: white;
      padding: 0.2em 0.5em;
      font-size: 1.2em;
      border-radius: 4px;
    }
    #controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 1em;
      margin-bottom: 1em;
    }
    #fontSizeSelector {
      display: flex;
      gap: 0.5em;
    }
    #currentSheetName {
      text-align: center;
      margin-bottom: 1em;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 1em;
    }
    th, td {
      border: 1px solid #ccc;
      padding: 0.5em;
    }
    .time-input {
      width: 6em;
    }
    .add-row {
      margin-top: 1em;
      text-align: center;
    }
  </style>
</head>
<body>
  <h2>字幕編集ツール</h2>

  <div id="subtitle-list-toggle" onclick="toggleSheetList()">▼保存済み字幕データ一覧</div>
  <div id="sheetList"></div>

  <div>
    <input type="text" id="videoUrlInput" placeholder="YouTube動画のURLまたはIDを入力" style="width: 100%;">
    <button onclick="loadSubtitles()">字幕を取得</button>
  </div>

  <div id="videoContainer">
    <iframe id="youtubePlayer" width="560" height="315" frameborder="0" allowfullscreen></iframe>
    <div id="overlaySubtitle"></div>
  </div>

  <div id="controls">
    <button onclick="playWithSubtitle()">字幕と動画を同期再生</button>
    <button onclick="pauseVideo()">一時停止</button>
    <button onclick="skipTime(-10)">10秒戻し</button>
    <button onclick="skipTime(10)">10秒送り</button>
    <div id="fontSizeSelector">
      <label>字幕サイズ:</label>
      <button onclick="setFontSize('small')">小</button>
      <button onclick="setFontSize('medium')">中</button>
      <button onclick="setFontSize('large')">大</button>
    </div>
  </div>

  <div id="currentSheetName">現在のシート: <span id="sheetName">-</span></div>

  <table id="subtitleTable">
    <thead>
      <tr><th>時間 (mm:ss.s)</th><th>字幕テキスト</th></tr>
    </thead>
    <tbody></tbody>
  </table>

  <div class="add-row">
    <button onclick="addEmptyRow()">＋ 行を追加</button>
  </div>

  <script>
    let subtitles = [];
    let currentSheet = '';
    let videoId = 'EJlmCPF55ZQ';
    let player;

    document.addEventListener('DOMContentLoaded', () => {
      loadSubtitles(videoId);
      fetchSheets();
    });

    function extractVideoId(urlOrId) {
      try {
        const url = new URL(urlOrId);
        if (url.hostname.includes('youtu')) {
          return url.searchParams.get('v') || url.pathname.split('/').pop();
        }
      } catch {
        return urlOrId;
      }
      return urlOrId;
    }

    function toggleSheetList() {
      const list = document.getElementById('sheetList');
      const toggle = document.getElementById('subtitle-list-toggle');
      if (list.style.display === 'none') {
        list.style.display = 'block';
        toggle.innerText = '▲保存済み字幕データ一覧';
      } else {
        list.style.display = 'none';
        toggle.innerText = '▼保存済み字幕データ一覧';
      }
    }

    function fetchSheets() {
      fetch(`https://script.google.com/macros/s/AKfycbzqGLb-WTleiLCt1ee3tDux4Lr4AczdrILq-w1AIAyXgRriASpQylx7cN-_L6Dke2Z72Q/exec`)
        .then(res => res.json())
        .then(data => {
          const list = document.getElementById('sheetList');
          list.innerHTML = '';
          data.sheets.forEach(name => {
            const div = document.createElement('div');
            div.textContent = name;
            div.onclick = () => loadSubtitles(null, name);
            list.appendChild(div);
          });
        });
    }

    function loadSubtitles(inputId, sheetName) {
      const url = document.getElementById('videoUrlInput').value || inputId;
      videoId = extractVideoId(url);
      let apiUrl = `https://script.google.com/macros/s/AKfycbzqGLb-WTleiLCt1ee3tDux4Lr4AczdrILq-w1AIAyXgRriASpQylx7cN-_L6Dke2Z72Q/exec?videoId=${videoId}`;
      if (sheetName) apiUrl += `&sheetName=${sheetName}`;
      fetch(apiUrl)
        .then(res => res.json())
        .then(data => {
          subtitles = data.subtitles || [];
          currentSheet = data.sheetName;
          document.getElementById('sheetName').innerText = currentSheet || '-';
          loadVideo(videoId);
          displaySubtitles();
        });
    }

    function loadVideo(id) {
      const iframe = document.getElementById('youtubePlayer');
      iframe.src = `https://www.youtube.com/embed/${id}?enablejsapi=1`;
    }

    function displaySubtitles() {
      const tbody = document.getElementById('subtitleTable').querySelector('tbody');
      tbody.innerHTML = '';
      const allSubs = [...subtitles];
      while (allSubs.length < 30) allSubs.push({ time: '', text: '' });
      allSubs.forEach(sub => {
        const tr = document.createElement('tr');

        const timeTd = document.createElement('td');
        const timeInput = document.createElement('input');
        timeInput.className = 'time-input';
        timeInput.value = formatTime(sub.time);
        timeTd.appendChild(timeInput);

        const textTd = document.createElement('td');
        const textInput = document.createElement('input');
        textInput.style.width = '100%';
        textInput.value = sub.text || '';
        textTd.appendChild(textInput);

        tr.appendChild(timeTd);
        tr.appendChild(textTd);
        tbody.appendChild(tr);
      });
    }

    function addEmptyRow() {
      subtitles.push({ time: '', text: '' });
      displaySubtitles();
    }

    function formatTime(t) {
      if (typeof t === 'string' && t.includes(':')) return t;
      try {
        const date = new Date(t);
        const mm = String(date.getMinutes()).padStart(2, '0');
        const ss = String(date.getSeconds()).padStart(2, '0');
        const ms = Math.floor(date.getMilliseconds() / 100);
        return `${mm}:${ss}.${ms}`;
      } catch {
        return '00:00.0';
      }
    }

    function playWithSubtitle() {
      const overlay = document.getElementById('overlaySubtitle');
      const rows = document.querySelectorAll('#subtitleTable tbody tr');
      let index = 0;
      const playInterval = setInterval(() => {
        const videoTime = 0; // ←埋め込みAPIから取得するなら要対応
        const row = rows[index];
        if (!row) return clearInterval(playInterval);
        const text = row.children[1].querySelector('input').value;
        overlay.innerText = text;
        index++;
      }, 2000);
    }

    function pauseVideo() {
      document.getElementById('youtubePlayer').contentWindow.postMessage('"pauseVideo"', '*');
    }

    function skipTime(sec) {
      // YouTube iframe APIが必要
    }

    function setFontSize(size) {
      const overlay = document.getElementById('overlaySubtitle');
      overlay.style.fontSize = size === 'small' ? '0.8em' : size === 'large' ? '1.6em' : '1.2em';
    }
  </script>
</body>
</html>
